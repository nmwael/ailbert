<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect x="0" y="0" width="100" height="100" fill="#fdfdfd"/>
  <!-- whiteboard -->
  <rect x="6" y="6" width="38" height="26" fill="#fdfdfd" stroke="#111" stroke-width="1.6"/>
  <path d="M 12 16 L 20 16 M 12 22 L 26 22 M 12 28 L 18 28" stroke="#111" stroke-width="1.2"/>
  <path d="M 10 12 L 22 24" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="46" y="6" width="48" height="14" fill="#fdfdfd" stroke="#111" stroke-width="1.6"/>
  <line x1="50" y1="10" x2="66" y2="10" stroke="#111" stroke-width="1.2"/>
  <line x1="50" y1="15" x2="60" y2="15" stroke="#111" stroke-width="1.2"/>
  <!-- two chairs behind the table -->
  <rect x="27" y="30" width="12" height="6" fill="#fdfdfd" stroke="#111" stroke-width="1.4"/>
  <path d="M 39 30 L 41 18 L 43 18 L 41 30 Z" fill="#fdfdfd" stroke="#111" stroke-width="1.3"/>
  <rect x="61" y="30" width="12" height="6" fill="#fdfdfd" stroke="#111" stroke-width="1.4"/>
  <path d="M 61 30 L 59 18 L 57 18 L 59 30 Z" fill="#fdfdfd" stroke="#111" stroke-width="1.3"/>
  <!-- floor -->
  <line x1="0" y1="82" x2="100" y2="82" stroke="#111" stroke-width="1.6"/>
  <!-- conference table: front layer (occludes characters standing behind it) -->
  <g data-z="1">
    <rect x="14" y="50" width="72" height="18" fill="#fdfdfd" stroke="#111" stroke-width="1.8"/>
    <line x1="20" y1="54" x2="34" y2="58" stroke="#111" stroke-width="1"/>
    <line x1="42" y1="51" x2="66" y2="51" stroke="#111" stroke-width="1"/>
    <line x1="50" y1="68" x2="50" y2="84" stroke="#111" stroke-width="1.6"/>
    <line x1="44" y1="84" x2="56" y2="84" stroke="#111" stroke-width="1.6"/>
  </g>
</svg>