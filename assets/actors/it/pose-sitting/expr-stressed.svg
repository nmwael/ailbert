<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- it, sitting, stressed — local units == % of panel when placed -->
  <!-- legs -->
  <path d="M 44 74 L 40 88 L 34 91" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <path d="M 56 74 L 60 88 L 66 91" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <!-- torso -->
  <path d="M 40 54 L 38 76 L 62 76 L 60 54 Z" fill="#fdfdfd" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
  <line x1="42" y1="60" x2="50" y2="68" stroke="#111" stroke-width="1"/>
  <line x1="46" y1="58" x2="54" y2="66" stroke="#111" stroke-width="1"/>
  <line x1="50" y1="57" x2="58" y2="64" stroke="#111" stroke-width="1"/>
  <path d="M 39 55 Q 44 51 50 51 Q 56 51 61 55 L 61 57 L 39 57 Z" fill="#fdfdfd" stroke="#111" stroke-width="1.6"/>
  <path d="M 45 57 L 51 57 L 51 61 L 45 61 Z" fill="none" stroke="#111" stroke-width="1.2"/>
  <path d="M 56 58 L 58 62 L 55 64" fill="none" stroke="#111" stroke-width="1.2"/>
  <!-- arms -->
  <path d="M 40 56 L 30 66 L 38 70" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <path d="M 60 56 L 70 66 L 62 70" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <!-- neck -->
  <line x1="50" y1="54" x2="50" y2="48" stroke="#111" stroke-width="2"/>
  <!-- head -->
  <ellipse cx="50" cy="41" rx="10" ry="10.5" fill="#f4c2a0" stroke="#111" stroke-width="2"/>
  <path d="M 40 42 Q 41 29 50 28 Q 59 29 60 42" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M 40 42 Q 40 33 43 30" fill="none" stroke="#111" stroke-width="1.2"/>
  <ellipse cx="40" cy="42" rx="2.2" ry="2.8" fill="#fdfdfd" stroke="#111" stroke-width="1.4"/>
  <ellipse cx="60" cy="42" rx="2.2" ry="2.8" fill="#fdfdfd" stroke="#111" stroke-width="1.4"/>
  <line x1="44" y1="36" x2="49" y2="38" stroke="#111" stroke-width="1.4"/>
  <line x1="57" y1="36" x2="52" y2="38" stroke="#111" stroke-width="1.4"/>
  <circle cx="46" cy="41" r="1.3" fill="#111"/>
  <circle cx="54" cy="41" r="1.3" fill="#111"/>
  <path d="M 44 45 Q 46.5 43 49 45 Q 51.5 47 54 45 Q 56 43.4 57 44.6" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 61 40 Q 63 43 61 45 Q 59 43 61 40" fill="#fdfdfd" stroke="#111" stroke-width="1.2"/>
  <!-- glasses -->
  <ellipse cx="44" cy="41" rx="3.4" ry="3.2" fill="none" stroke="#111" stroke-width="1.4"/>
  <ellipse cx="56" cy="41" rx="3.4" ry="3.2" fill="none" stroke="#111" stroke-width="1.4"/>
  <line x1="47.4" y1="41" x2="52.6" y2="41" stroke="#111" stroke-width="1.2"/>
  <path d="M 40.6 41 L 38 40" stroke="#111" stroke-width="1.2"/>
  <path d="M 59.4 41 L 62 40" stroke="#111" stroke-width="1.2"/>

  <!-- registration anchors -->
  <g id="anchor-feet" data-x="50" data-y="92" transform="translate(50 92)">
    <circle cx="0" cy="0" r="1.2" fill="#111"/>
  </g>
  <g id="anchor-mouth" data-x="50" data-y="46" transform="translate(50 46)">
    <circle cx="0" cy="0" r="1" fill="#111"/>
  </g>
</svg>
