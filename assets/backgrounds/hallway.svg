<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect x="0" y="0" width="100" height="100" fill="#fdfdfd"/>
  <!-- left wall -->
  <line x1="0" y1="30" x2="100" y2="30" stroke="#111" stroke-width="1.6"/>
  <!-- door 1 -->
  <rect x="12" y="30" width="20" height="48" fill="#fdfdfd" stroke="#111" stroke-width="1.8"/>
  <circle cx="28" cy="54" r="1.4" fill="#111"/>
  <!-- door 2 -->
  <rect x="76" y="30" width="18" height="48" fill="#fdfdfd" stroke="#111" stroke-width="1.8"/>
  <circle cx="80" cy="54" r="1.4" fill="#111"/>
  <!-- light strip -->
  <rect x="34" y="12" width="36" height="5" fill="#fdfdfd" stroke="#111" stroke-width="1.4"/>
  <line x1="38" y1="14.5" x2="40" y2="14.5" stroke="#111" stroke-width="0.8"/>
  <line x1="44" y1="14.5" x2="46" y2="14.5" stroke="#111" stroke-width="0.8"/>
  <line x1="50" y1="14.5" x2="52" y2="14.5" stroke="#111" stroke-width="0.8"/>
  <line x1="56" y1="14.5" x2="58" y2="14.5" stroke="#111" stroke-width="0.8"/>
  <line x1="62" y1="14.5" x2="64" y2="14.5" stroke="#111" stroke-width="0.8"/>
  <!-- framed poster on wall -->
  <rect x="42" y="40" width="16" height="14" fill="#fdfdfd" stroke="#111" stroke-width="1.5"/>
  <path d="M 44 44 L 56 44 M 44 48 L 52 48" stroke="#111" stroke-width="1"/>
  <!-- water cooler -->
  <rect x="56" y="44" width="10" height="10" fill="#fdfdfd" stroke="#111" stroke-width="1.4"/>
  <path d="M 58 44 Q 58 38 61 38 Q 64 38 64 44" fill="none" stroke="#111" stroke-width="1.4"/>
  <line x1="61" y1="54" x2="61" y2="60" stroke="#111" stroke-width="1.4"/>
  <line x1="55" y1="60" x2="67" y2="60" stroke="#111" stroke-width="1.4"/>
  <!-- floor -->
  <line x1="0" y1="82" x2="100" y2="82" stroke="#111" stroke-width="1.6"/>
  <line x1="6" y1="86" x2="16" y2="86" stroke="#111" stroke-width="1"/>
  <line x1="84" y1="86" x2="94" y2="86" stroke="#111" stroke-width="1"/>
</svg>