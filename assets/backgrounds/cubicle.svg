<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect x="0" y="0" width="100" height="100" fill="#fdfdfd"/>
  <!-- cubicle partitions -->
  <path d="M 4 44 L 96 44 L 96 38 L 4 38 Z" fill="#fdfdfd" stroke="#111" stroke-width="1.6"/>
  <line x1="4" y1="50" x2="96" y2="50" stroke="#111" stroke-width="1.2"/>
  <!-- desk -->
  <rect x="20" y="52" width="60" height="5" fill="#fdfdfd" stroke="#111" stroke-width="1.8"/>
  <line x1="24" y1="57" x2="24" y2="84" stroke="#111" stroke-width="1.8"/>
  <line x1="76" y1="57" x2="76" y2="84" stroke="#111" stroke-width="1.8"/>
  <!-- monitor -->
  <rect x="42" y="30" width="20" height="16" fill="#fdfdfd" stroke="#111" stroke-width="1.6"/>
  <path d="M 48 46 L 48 52 L 56 52 L 56 46" fill="none" stroke="#111" stroke-width="1.4"/>
  <line x1="46" y1="35" x2="58" y2="35" stroke="#111" stroke-width="1"/>
  <line x1="46" y1="40" x2="54" y2="40" stroke="#111" stroke-width="1"/>
  <!-- keyboard + mouse -->
  <rect x="30" y="48" width="22" height="3" fill="#fdfdfd" stroke="#111" stroke-width="1.2"/>
  <line x1="34" y1="49.5" x2="48" y2="49.5" stroke="#111" stroke-width="0.8"/>
  <path d="M 66 49 Q 70 49 70 52 Q 70 54 66 54 Q 62 54 62 52 Q 62 49 66 49" fill="#fdfdfd" stroke="#111" stroke-width="1.2"/>
  <rect x="22" y="33" width="9" height="11" fill="#fdfdfd" stroke="#111" stroke-width="1.3"/>
  <path d="M 26 26 Q 26 30 26 33" fill="none" stroke="#111" stroke-width="1.3"/>
  <!-- sticky note -->
  <rect x="80" y="40" width="8" height="8" fill="#fdfdfd" stroke="#111" stroke-width="1.2"/>
  <!-- floor -->
  <line x1="0" y1="88" x2="100" y2="88" stroke="#111" stroke-width="1.6"/>
</svg>