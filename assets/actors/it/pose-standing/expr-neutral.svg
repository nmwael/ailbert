<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- it, standing, neutral — local units == % of panel when placed -->
  <!-- legs -->
  <path d="M 45 84 L 44 92" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 55 84 L 56 92" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 41 92 L 47 92" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <path d="M 53 92 L 59 92" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <!-- torso -->
  <path d="M 39 62 L 37 84 L 63 84 L 61 62 Z" fill="#fdfdfd" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 50 62 L 46 68 L 50 84 L 54 68 Z" fill="#fdfdfd" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="41" y1="66" x2="47" y2="70" stroke="#111" stroke-width="1"/>
  <line x1="59" y1="66" x2="53" y2="70" stroke="#111" stroke-width="1"/>
  <path d="M 38 64 Q 42 60 50 60 Q 58 60 62 64 L 61 66 L 39 66 Z" fill="#fdfdfd" stroke="#111" stroke-width="1.6"/>
  <path d="M 45 65 L 51 65 L 51 69 L 45 69 Z" fill="none" stroke="#111" stroke-width="1.2"/>
  <path d="M 55 65 L 55 71 L 52 73" fill="none" stroke="#111" stroke-width="1.2"/>
  <!-- arms -->
  <path d="M 39 64 L 32 79 L 36 82" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <path d="M 61 64 L 68 79 L 64 82" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <!-- neck -->
  <line x1="50" y1="62" x2="50" y2="58" stroke="#111" stroke-width="2"/>
  <!-- head -->
  <ellipse cx="50" cy="50" rx="10" ry="10.5" fill="#f4c2a0" stroke="#111" stroke-width="2"/>
  <path d="M 40 47 Q 41 37 50 36 Q 59 37 60 47" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M 40 47 Q 40 39 44 37" fill="none" stroke="#111" stroke-width="1.2"/>
  <ellipse cx="40" cy="47" rx="2.2" ry="2.8" fill="#fdfdfd" stroke="#111" stroke-width="1.4"/>
  <ellipse cx="60" cy="47" rx="2.2" ry="2.8" fill="#fdfdfd" stroke="#111" stroke-width="1.4"/>
<line x1="44" y1="46" x2="49" y2="46" stroke="#111" stroke-width="1.4"/>
  <line x1="51" y1="46" x2="56" y2="46" stroke="#111" stroke-width="1.4"/>
<circle cx="46" cy="50" r="1.3" fill="#111"/>
  <circle cx="54" cy="50" r="1.3" fill="#111"/>
<path d="M 46 54 Q 50 55.5 54 54" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>

  <!-- glasses -->
  <ellipse cx="47" cy="50" rx="2.7" ry="3.1" fill="none" stroke="#111" stroke-width="1.4"/>
  <ellipse cx="53" cy="50" rx="2.7" ry="3.1" fill="none" stroke="#111" stroke-width="1.4"/>
  <path d="M 49.7 50 L 50.3 50" stroke="#111" stroke-width="1.2"/>
  <path d="M 44.3 50 L 41.5 49" stroke="#111" stroke-width="1.2"/>
  <path d="M 55.7 50 L 58.5 49" stroke="#111" stroke-width="1.2"/>

  <!-- registration anchors -->
  <g id="anchor-feet" data-x="50" data-y="92" transform="translate(50 92)">
    <circle cx="0" cy="0" r="1.2" fill="#111"/>
  </g>
  <g id="anchor-mouth" data-x="50" data-y="55" transform="translate(50 55)">
    <circle cx="0" cy="0" r="1" fill="#111"/>
  </g>
</svg>
