<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- boss, standing, neutral — local units == % of panel when placed -->
  <!-- pointy hair -->
  <path d="M 42 46 L 39 36 L 46 42 Z" fill="#111" stroke="#111" stroke-width="1.4"/>
  <path d="M 58 46 L 61 36 L 54 42 Z" fill="#111" stroke="#111" stroke-width="1.4"/>
  <!-- head -->
  <ellipse cx="50" cy="54" rx="9.5" ry="10" fill="#f4c2a0" stroke="#111" stroke-width="2"/>
  <path d="M 42 48 Q 50 43 58 48" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="46" cy="53" r="1.3" fill="#111"/>
  <circle cx="54" cy="53" r="1.3" fill="#111"/>
  <line x1="46" y1="50" x2="49" y2="50.5" stroke="#111" stroke-width="1.2"/>
  <line x1="54" y1="50" x2="51" y2="50.5" stroke="#111" stroke-width="1.2"/>
  <path d="M 46 59 Q 50 61.5 54 59" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
  <!-- neck -->
  <line x1="50" y1="63" x2="50" y2="67" stroke="#111" stroke-width="2"/>
  <!-- jacket / torso -->
  <path d="M 38 67 L 36 84 L 64 84 L 62 67 Z" fill="#fdfdfd" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 50 67 L 46 74 L 50 84 L 54 74 Z" fill="#fdfdfd" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M 50 74 L 48 80 L 50 84 L 52 80 Z" fill="#111" stroke="#111" stroke-width="1"/>
  <line x1="40" y1="72" x2="46" y2="78" stroke="#111" stroke-width="1"/>
  <line x1="39" y1="76" x2="45" y2="82" stroke="#111" stroke-width="1"/>
  <line x1="60" y1="72" x2="54" y2="78" stroke="#111" stroke-width="1"/>
  <line x1="61" y1="76" x2="55" y2="82" stroke="#111" stroke-width="1"/>
  <!-- arms -->
  <path d="M 38 69 L 32 82 L 36 84" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <path d="M 62 69 L 68 82 L 64 84" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <!-- legs -->
  <path d="M 45 84 L 44 92" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 55 84 L 56 92" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 41 92 L 47 92" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <path d="M 53 92 L 59 92" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <!-- registration anchors -->
  <g id="anchor-feet" data-x="50" data-y="92" transform="translate(50 92)">
    <circle cx="0" cy="0" r="1.2" fill="#111"/>
  </g>
  <g id="anchor-mouth" data-x="50" data-y="60" transform="translate(50 60)">
    <circle cx="0" cy="0" r="1" fill="#111"/>
  </g>
</svg>