<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- worker, sitting, stressed — local units == % of panel when placed -->
  <!-- legs -->
  <path d="M 44 74 L 40 88 L 34 91" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <path d="M 56 74 L 60 88 L 66 91" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <!-- torso -->
  <path d="M 40 54 L 38 76 L 62 76 L 60 54 Z" fill="#fdfdfd" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
  <line x1="42" y1="60" x2="50" y2="68" stroke="#111" stroke-width="1"/>
  <line x1="46" y1="58" x2="54" y2="66" stroke="#111" stroke-width="1"/>
  <line x1="50" y1="57" x2="58" y2="64" stroke="#111" stroke-width="1"/>
  <!-- arms -->
  <path d="M 40 56 L 30 66 L 38 70" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <path d="M 60 56 L 70 66 L 62 70" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <!-- neck -->
  <line x1="50" y1="54" x2="50" y2="48" stroke="#111" stroke-width="2"/>
  <!-- head -->
  <ellipse cx="50" cy="41" rx="10" ry="10.5" fill="#f4c2a0" stroke="#111" stroke-width="2"/>
<path d="M 42 47 Q 42 36 50 35 Q 58 36 58 47" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M 42 47 Q 42 37 44 36" fill="none" stroke="#111" stroke-width="1.2"/>
<line x1="44" y1="45" x2="49" y2="47" stroke="#111" stroke-width="1.4"/>
  <line x1="57" y1="45" x2="52" y2="47" stroke="#111" stroke-width="1.4"/>
<circle cx="46" cy="50" r="1.3" fill="#111"/>
  <circle cx="54" cy="50" r="1.3" fill="#111"/>
<path d="M 44 46 Q 46.5 44 49 46 Q 51.5 48 54 46 Q 56 44.4 57 45.6" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 61 42 Q 63 45 61 47 Q 59 45 61 42" fill="#fdfdfd" stroke="#111" stroke-width="1.2"/>

  <!-- registration anchors -->
  <g id="anchor-feet" data-x="50" data-y="92" transform="translate(50 92)">
    <circle cx="0" cy="0" r="1.2" fill="#111"/>
  </g>
  <g id="anchor-mouth" data-x="50" data-y="46" transform="translate(50 46)">
    <circle cx="0" cy="0" r="1" fill="#111"/>
  </g>
</svg>
